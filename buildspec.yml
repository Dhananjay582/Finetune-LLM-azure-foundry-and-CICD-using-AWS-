version: 0.2

env:
  variables:
    NODE_ENV: production

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "=== Node / npm versions ==="
      - node --version
      - npm --version
      - echo "=== Installing dependencies ==="
      - npm ci

  build:
    commands:
      - echo "=== Building React app ==="
      - npm run build
      - echo "=== Build output ==="
      - ls -la dist/

  post_build:
    commands:
      - echo "=== Syncing static assets to S3 (long-cache) ==="
      - aws s3 sync dist/ s3://$S3_BUCKET_NAME --delete --exclude "index.html" --cache-control "public,max-age=31536000,immutable" --metadata-directive REPLACE
      - echo "=== Uploading index.html with no-cache ==="
      - aws s3 cp dist/index.html s3://$S3_BUCKET_NAME/index.html --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html; charset=utf-8" --metadata-directive REPLACE
      - echo "=== Invalidating CloudFront cache (if configured) ==="
      - |
        if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
          aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
        else
          echo "No CLOUDFRONT_DISTRIBUTION_ID set, skipping invalidation."
        fi
      - echo "=== Deploy complete ==="

artifacts:
  files:
    - '**/*'
  base-directory: dist
  discard-paths: no
